<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compra pública electrónica y transparencia departamental en Colombia (2021-2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/odc.css">
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>

<aside class="menu" id="menu" aria-label="Menú">
  <div class="menu__head">
    <span class="menu__inst">Universidad de Cundinamarca</span>
    <button class="icon-btn menu__close" id="menuClose" aria-label="Cerrar menú">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav id="menuNav"></nav>
</aside>
<div class="scrim" id="scrim" hidden></div>

<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuOpen" aria-label="Menú" aria-controls="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="topbar__title">
      <span class="topbar__screen" id="screenLabel"></span>
      <span class="topbar__odc" id="odcTitle"></span>
    </div>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  </header>

  <main id="contenido" tabindex="-1"></main>

  <footer class="pager" id="pager">
    <button class="nav-btn" id="prevBtn" aria-label="Anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="nav-btn nav-btn--menu" id="menuBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h7v5H4zM13 6h7v5h-7zM4 13h7v5H4zM13 13h7v5h-7z"/></svg>
      <span>Menú</span>
    </button>
    <button class="nav-btn nav-btn--next" id="nextBtn" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal__card">
    <div class="modal__head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<script src="js/contenido.js"></script>
<script src="js/odc.js"></script>
</body>
</html>
